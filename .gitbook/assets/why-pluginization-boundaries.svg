<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" xml:lang="en">
	<title id="title">The same capabilities, with clear business ownership</title>
	<desc id="desc">Above: twelve responsibilities, including creating orders, confirming payments, and sending commands, are scattered within one application. Below: the same responsibilities belong to trading, payment, and IoT modules within that application.</desc>
