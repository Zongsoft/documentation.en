	<title id="title">Each module owns its implementation and resources</title>
	<desc id="desc">An application comprises trading, payment, and IoT modules. Each owns models, services, events or handlers, site adapters, manifests, settings, mappings, and resources, with product extensions, payment providers, or device protocols where appropriate. Adapted from Hiisea’s micro-domain.png for server-side plugins.</desc>
